config_version: 2
settings:
  bindings.commands:
    global:
      normal:
        ',Ma': hint links spawn st -e mpv --no-video {hint-url}
        ',Mh': hint links spawn mpv --ytdl-format=best {hint-url}
        ',Ml': hint links spawn mpv --ytdl-format=worst {hint-url}
        ',Mm': hint links spawn mpv --ytdl-format="bestvideo[height<=480]+bestaudio/best[height<=480]"
          {hint-url}
        ',Mym': hint links spawn st -e mpv --no-video --ytdl-format=bestaudio {hint-url}
        ',ma': spawn st -e mpv --no-video {url}
        M: hint links spawn mpv {hint-url}
  colors.webpage.darkmode.enabled:
    global: true
  content.blocking.enabled:
    global: true
  content.blocking.method:
    global: both
  content.fullscreen.window:
    global: true
  content.javascript.clipboard:
    https://annas-archive.org: access-paste
